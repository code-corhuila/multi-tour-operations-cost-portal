server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # The module and its stylesheet are never cached: a new build must reach the container at the next load (Annex H).
  location / {
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location = /healthz {
    default_type text/plain;
    return 200 "ok";
  }
}
